<!DOCTYPE html>
<html>
<head>
    <title>Automatic Bonafide Certificate</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        .student {
            margin-top: 25px;
            padding: 20px;
            background: #eee;
        }

        .error {
            color: red;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Automatic Bonafide Certificate</h1>

    <form method="POST">

        <label>Enter Student USN</label>

        <input
            type="text"
            name="usn"
            placeholder="Example: 1AB23CS001"
            required
        >

        <button type="submit">
            Search Student
        </button>

    </form>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    {% if student %}

        <div class="student">

            <h2>Student Found</h2>

            <p><b>USN:</b> {{ student["usn"] }}</p>

            <p><b>Name:</b> {{ student["name"] }}</p>

            <p><b>Course:</b> {{ student["course"] }}</p>

            <p><b>Department:</b> {{ student["department"] }}</p>

            <p><b>Semester:</b> {{ student["semester"] }}</p>
            <a href="/generate/{{ student['usn'] }}">
             <button type="button">
               Generate Bonafide Certificate
              </button>
                 </a>
   

        </div>

    {% endif %}

</div>

</body>
</html>
